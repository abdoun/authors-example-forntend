services:
  authors-example-frontend:
    build: .
    image: authors-example-frontend:latest
    container_name: authors-example-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    env_file:
      - .env
    networks:
      - authors-net
      - user-auth-network

networks:
  authors-net:
    name: authors-net
  user-auth-network:
    external: true
    name: user-auth-node-mysql_user-auth-network
