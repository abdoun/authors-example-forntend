server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # env.js is generated from .env at container startup; never cache it.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: let React Router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
